name: CI

# This crate used to be a member of the dcc-core workspace, where `cargo test
# --workspace` ran its suite for free. It is standalone now, so if this file does
# not run the tests, nothing does — and the suite rots invisibly rather than
# failing. That is the whole reason this exists.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # R12 of dcc-core's import contract: this crate must build for wasm32,
          # because dcc-core ships a WebAssembly binding and anything it imports
          # travels there. See doc/Conformance.md.
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      # The fidelity suites are `--ignored` and need a SparseyCore checkout, so they
      # do not run here. The committed fixtures under tests/fixtures/ are what the
      # non-ignored fidelity tests read.
      - name: Test (release)
        run: cargo test --release

      - name: Build with all features
        run: cargo build --all-features

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Building is not enough: a demo that panics on the first frame still compiles.
      #
      # This gate is the exit code and nothing else — it asks whether each demo sets
      # up, encodes, runs frames, reports and exits, never whether it learned
      # anything. The budgets are deliberately far too small to saturate or converge
      # at: whether a configuration learns is an offline experiment run with --repeat
      # and --sweep, not a build gate. See doc/Demos.md.
      - name: Smoke-run the demos
        run: |
          set -e
          cargo run --release --example noise_robustness -- --classes 4 --test-reps 4 --quiet
          cargo run --release --example capacity -- --patterns 40 --every 20 --quiet
          cargo run --release --example sequence_recognition -- --episodes 2 --length 3 --alphabet 4 --epochs 4 --probes 4 --quiet
          cargo run --release --example classify_stream -- --classes 3 --per-class 2 --test-reps 3 --quiet
          cargo run --release --example partial_cue -- --patterns 4 --reps 3 --quiet
          cargo run --release --example backoff_modality -- --items 4 --epochs 3 --reps 3 --quiet
          # sequence_recognition again through the path that reveals why its default
          # backoff chain is the one it is; see doc/Demos.md.
          cargo run --release --example sequence_recognition -- --episodes 2 --length 3 --alphabet 4 --epochs 4 --probes 4 --backoff canonical --quiet
          # Once through the sweep driver, so the run-matrix path that every offline
          # experiment goes through is executed by CI at all rather than only built.
          cargo run --release --example noise_robustness -- --classes 4 --test-reps 2 --sweep noise=0,0.5 --repeat 2 --quiet
          # The four minimal API walkthroughs, which predate the demo suite.
          cargo run --release --example hierarchy
          cargo run --release --example learn_and_recognize
          cargo run --release --example novelty_detection
          cargo run --release --example save_and_load

      # Checks the metrics *format* and same-seed determinism, never a metric value.
      # Determinism is what --repeat and --sweep rest on, so it is tested directly
      # rather than assumed.
      - name: Metrics schema and determinism
        run: |
          set -e
          cargo run --release --example noise_robustness -- --classes 4 --test-reps 4 --silent --metrics a.jsonl
          cargo run --release --example noise_robustness -- --classes 4 --test-reps 4 --silent --metrics b.jsonl
          diff a.jsonl b.jsonl
          python3 - <<'PY'
          import json
          recs = [json.loads(l) for l in open("a.jsonl")]
          kinds = [r["kind"] for r in recs]
          assert kinds[0] == "run", kinds
          assert "summary" in kinds and "verdict" in kinds, kinds
          assert all({"demo", "seed", "run"} <= r.keys() for r in recs)
          print("metrics schema ok:", kinds)
          PY

      # Rustdoc warnings are the only mechanical guard on intra-doc links, and this
      # crate's docs cite types across a dozen modules.
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      # R12. This crate failed this check from extraction until 2026-08-12 and nobody
      # noticed, because dcc-core's own wasm build supplies a `getrandom` backend and
      # masked it. The rest of the contract is asserted by `tests/conformance.rs`, which
      # `cargo test` above already runs; this one needs a real cross-compile, so it is a
      # separate step.
      #
      # A failure here means something reintroduced a dependency needing OS entropy.
      # The fix is NOT to select a getrandom backend — that is a binary's decision, and
      # choosing one here would impose it on every consumer. See doc/Conformance.md.
      - name: Builds for wasm32 (R12)
        run: cargo check --target wasm32-unknown-unknown

      # `cargo tree -d` ALWAYS exits 0 — it REPORTS duplicates, it does not fail on
      # them. So `run: cargo tree -d`, which is what this step was until 2026-08-12,
      # guarded nothing: the job went green with any duplicate at all.
      #
      # Duplicates are not uniformly bad. Two `syn` majors arriving through unrelated
      # proc-macros are ordinary and unfixable from here. Two `serde` or two `rand` are
      # a different thing: the types stop being the same types across the boundary, and
      # a second `rand` is a second RNG stream, which silently unseeds whatever draws
      # from it. So print everything, fail on the short list that actually breaks.
      - name: No duplicate core dependencies
        run: |
          echo "--- all duplicates (informational) ---"
          cargo tree -d || true
          dups=$(cargo tree -d 2>/dev/null \
                 | grep -E '^(serde|rand|rand_core|rand_chacha|rand_xoshiro|schemars|thiserror) v[0-9]' \
                 | sort -u)
          if [ -n "$dups" ]; then
            echo
            echo "FAIL: more than one version of a core dependency is in the graph:"
            echo "$dups"
            exit 1
          fi
          echo
          echo "OK: no duplicate core dependencies"
